# ===========================================================================
# Products to track.
#
# To add a product, copy one block below and change the `url` (and optionally
# the `id`, `name`, etc.). Any Amazon URL format is accepted - the ASIN is
# extracted and used as the canonical identifier so duplicates are prevented.
#
# All fields except `url` are optional. Sensible defaults apply.
# ===========================================================================

products:
  # Minimal entry - just a URL. An `id` is auto-generated from the ASIN.
  # Typical entry with a friendly id and name.

  - id: XPPEN-DECO-640
    name: "XPPEN-DECO-640"
    url: "https://amzn.in/d/0bB8qm3H"
    enabled: true

  # Entry with optional pricing/notification settings.
  # - id: example-headphones
  #   name: "Example Headphones"
  #   url: "https://www.amazon.in/gp/product/B0abcdefg"
