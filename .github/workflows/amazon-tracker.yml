# ===========================================================================
# Amazon Price Tracker - GitHub Actions workflow
#
# This runs the tracker on a schedule AND on demand. No local machine needed.
#
# ───────────────────────────────────────────────────────────────────────────
# HOW TO CHANGE THE CHECK INTERVAL
# ───────────────────────────────────────────────────────────────────────────
# Edit the `cron:` line under `schedule:` below. GitHub only runs scheduled
# workflows from the repository's DEFAULT branch.
#
# Common intervals (pick ONE, comment out the others):
#   Every 30 min : cron: "*/30 * * * *"
#   Every hour   : cron: "0 * * * *"
#   Every 2 hours: cron: "0 */2 * * *"
#   Daily 9:30am : cron: "30 4 * * *"   (UTC; 09:30 IST = 04:00 UTC)
#
# NOTE: GitHub may delay scheduled runs by up to ~15 min during busy periods.
# ===========================================================================

name: Amazon Price Tracker

on:
  schedule:
    # ┌───────────── CHANGE ME: run every 2 hours ─────────────┐
    - cron: "0 */2 * * *"
    # └─────────────────────────────────────────────────────────┘

  # Manual run from the Actions tab ("Run workflow" button).
  workflow_dispatch:
    inputs:
      product:
        description: "Optional: check only this product id (leave blank for all)"
        required: false
        default: ""
      verbose:
        description: "Verbose logging"
        type: boolean
        required: false
        default: false

# Prevent two runs from modifying the SQLite database simultaneously.
concurrency:
  group: amazon-tracker
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit history back to the repo

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run tracker check
        id: check
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.product }}" ]; then
            ARGS="--product ${{ github.event.inputs.product }}"
          fi
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS -v"
          fi
          # Always exit 0 even if some products fail, so history still commits.
          python -m tracker check $ARGS || true

      - name: 📊 Build static dashboard
        run: |
          python -m tracker dashboard --out docs || true

      - name: 💾 Commit & push history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.db data/charts/ docs/ || true
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "🤖 Update Amazon price history" || true
            git push || true
          fi
