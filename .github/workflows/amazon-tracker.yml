# ===========================================================================
# Amazon Price Tracker - GitHub Actions workflow
#
# This runs the tracker on a schedule AND on demand. No local machine needed.
#
# ───────────────────────────────────────────────────────────────────────────
# IMPORTANT: GitHub Actions runners use datacenter (Azure) IP ranges. Amazon
# CAPTCHAs raw HTTP requests from these IPs ~100% of the time. So this workflow
# installs Playwright (headless Chromium) and uses FETCH_STRATEGY=playwright,
# which bypasses most bot checks. See README "Known limitations".
# ───────────────────────────────────────────────────────────────────────────
#
# HOW TO CHANGE THE CHECK INTERVAL
# Edit the `cron:` line under `schedule:` below. Scheduled workflows only run
# from the repository's DEFAULT branch.
#   Every 30 min : cron: "*/30 * * * *"
#   Every hour   : cron: "0 * * * *"
#   Every 2 hours: cron: "0 */2 * * *"
#   Daily 9:30am : cron: "30 4 * * *"   (UTC; 09:30 IST = 04:00 UTC)
#
# NOTE: GitHub may delay scheduled runs by up to ~15 min during busy periods.
# NOTE: Playwright adds ~15-25s per product; keep intervals reasonable.
# ===========================================================================

name: Amazon Price Tracker

on:
  schedule:
    # ┌───────────── CHANGE ME: run every 2 hours ─────────────┐
    - cron: "0 */4 * * *"
    # └─────────────────────────────────────────────────────────┘

  # Manual run from the Actions tab ("Run workflow" button).
  workflow_dispatch:
    inputs:
      product:
        description: "Optional: check only this product id (leave blank for all)"
        required: false
        default: ""
      verbose:
        description: "Verbose logging"
        type: boolean
        required: false
        default: false
      strategy:
        description: "Fetch strategy"
        type: choice
        options: ["playwright", "auto", "requests"]
        required: false
        default: "playwright"

# Prevent two runs from modifying the SQLite database simultaneously.
concurrency:
  group: amazon-tracker
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit history back to the repo

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      # Use a real headless browser to get past Amazon's datacenter-IP CAPTCHA.
      FETCH_STRATEGY: ${{ github.event.inputs.strategy || 'playwright' }}
      # Optional: route requests through a residential proxy if you have one.
      AMAZON_PROXY: ${{ secrets.AMAZON_PROXY }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: 🌐 Install Chromium for Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: 🔍 Run tracker check
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.product }}" ]; then
            ARGS="--product ${{ github.event.inputs.product }}"
          fi
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS -v"
          fi
          echo "Using FETCH_STRATEGY=$FETCH_STRATEGY"
          # Always exit 0 even if some products fail, so history still commits.
          python -m tracker check $ARGS || true

      - name: 📊 Build static dashboard
        run: |
          python -m tracker dashboard --out docs || true

      - name: 💾 Commit & push history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.db data/charts/ docs/ || true
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "🤖 Update Amazon price history" || true
            git push || true
          fi
